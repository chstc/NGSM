[workspace]
resolver = "2"
members = [
    "crates/servicemanager-core",
    "crates/servicemanager-win32",
    "crates/servicemanager-registry",
    "crates/servicemanager-supervisor",
    "crates/servicemanager-runner",
    "crates/servicemanager-broker",
    "crates/servicemanager-gui",
    "crates/servicemanager-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
# Real minimum: the resolved dependency graph (image 1.88, clap 1.85,
# slint/embed-resource) needs 1.88. Declaring less would make a
# build on the stated toolchain fail despite this metadata claiming support.
rust-version = "1.88"
# BSD Zero Clause License — a permissive, OSI-approved license that requires
# no attribution, preserving the no-strings spirit of the public-domain NSSM
# project this descends from. Full text in the LICENSE file alongside this
# manifest (the workspace root).
license = "0BSD"
repository = "https://github.com/chstc/NGSM"

[workspace.dependencies]
servicemanager-core = { path = "crates/servicemanager-core" }
servicemanager-win32 = { path = "crates/servicemanager-win32" }
servicemanager-registry = { path = "crates/servicemanager-registry" }
servicemanager-supervisor = { path = "crates/servicemanager-supervisor" }
servicemanager-runner = { path = "crates/servicemanager-runner" }
servicemanager-broker = { path = "crates/servicemanager-broker" }
servicemanager-gui = { path = "crates/servicemanager-gui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
os_pipe = "1"

# Slint runtime + build helper share one version so a `cargo update`
# cannot drift them across patch releases.
slint = { version = "~1.16", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2"] }
slint-build = "~1.16"

[workspace.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Services",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_Security_Authorization",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
