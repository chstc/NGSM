[package]
name = "servicemanager-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Slint-based desktop UI for NGSM."
publish = false

[dependencies]
servicemanager-core = { workspace = true }
servicemanager-win32 = { workspace = true }
servicemanager-registry = { workspace = true }
slint = { version = "1.8", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2"] }
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }

[build-dependencies]
slint-build = "1.8"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
