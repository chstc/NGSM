[package]
name = "servicemanager-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "egui-based desktop UI for NGSM."
publish = false

[dependencies]
servicemanager-core = { workspace = true }
servicemanager-win32 = { workspace = true }
servicemanager-registry = { workspace = true }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.29", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
