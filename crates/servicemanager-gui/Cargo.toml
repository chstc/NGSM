[package]
name = "servicemanager-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Slint-based desktop UI for NGSM."
publish = false

[dependencies]
servicemanager-core = { workspace = true }
servicemanager-win32 = { workspace = true }
servicemanager-registry = { workspace = true }
servicemanager-ops = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
slint = { workspace = true }
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing", "macros", "local-offset"] }
tempfile = "3"

[build-dependencies]
slint-build = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
