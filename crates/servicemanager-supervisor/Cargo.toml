[package]
name = "servicemanager-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "NGSM child-process supervisor: lifecycle, restart/throttle/exit-action policies, online log rotation, pause/continue, power events, and hooks."
publish = false

[dependencies]
servicemanager-core = { workspace = true }
servicemanager-win32 = { workspace = true }
thiserror = { workspace = true }
os_pipe = { workspace = true }
serde_json = { workspace = true }
time = { version = "0.3", default-features = false, features = ["std", "formatting", "macros"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
tempfile = "3"
